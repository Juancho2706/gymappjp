packages:
  - 'apps/*'
  - 'packages/*'

# React 19 peer dep overrides (moved from package.json pnpm.overrides in pnpm v11)
overrides:
  react: 19.1.0
  react-dom: 19.1.0
  # Security: Dependabot transitive bumps, in-major only (verified build+test+CI+preview green).
  # Multi-major deps use pkg@major selectors so each consumer stays within its own major.
  shell-quote: '>=1.8.4 <2'
  dompurify: '>=3.4.12 <4'
  protobufjs: '>=7.6.5 <8'
  '@babel/core': '>=7.29.6 <8'
  postcss: '>=8.5.23 <9'
  '@opentelemetry/core': '>=2.8.0 <3'
  tar: '>=7.5.18 <8'
  fast-uri: '>=3.1.5 <4'
  ip-address: '>=10.3.1 <11'
  vite: 7.3.5
  vitest: 4.1.10
  'js-yaml@3': '>=3.15.1 <4'
  'nanoid@3': '>=3.3.18 <4'
  'uuid@11': '>=11.1.1 <12'
  'js-yaml@4': '>=4.3.0 <5'
  'undici@6': '>=6.28.0 <7'
  'undici@7': '>=7.29.0 <8'
  'brace-expansion@1': '>=1.1.16 <2'
  'brace-expansion@2': '>=2.1.4 <3'
  'brace-expansion@5': '>=5.0.7 <6'
  'ws@6': '>=6.2.4 <7'
  'ws@7': '>=7.5.11 <8'
  'ws@8': '>=8.21.0 <9'
  # @expo/plist@0.0.18 (via @bacons/apple-targets > @bacons/xcode) pide ~0.7.0 => 0.7.13 vulnerable.
  # ACOTADO A ESA RUTA a proposito: 0.9.x exige mimeType en parseFromString y las 4 copias de
  # @expo/plist del arbol lo llaman sin el (build/parse.js:69) => un override global rompe el
  # prebuild de iOS con TypeError (reproducido). 0.8.13 ya vive en el arbol por otra ruta.
  '@expo/plist@0.0.18>@xmldom/xmldom': 0.8.13

# Allowlist for packages that need legitimate postinstall scripts (native binaries, CLIs).
# New packages are blocked by default â€” supply chain defense (pnpm v10+ behavior).
allowBuilds:
  '@sentry/cli': true      # downloads sentry CLI binary
  core-js: true            # polyfill postinstall message only
  esbuild: true            # downloads esbuild native binary (required by vite/next)
  msw: true                # generates service worker via `npx msw init`
  protobufjs: true         # compiles proto definitions
  puppeteer: true          # downloads Chromium for E2E tests
  sharp: true              # native image processing (required by Next.js)
  supabase: true           # downloads supabase CLI binary
  unrs-resolver: true      # native Rust resolver binary
