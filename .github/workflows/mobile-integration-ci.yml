name: Mobile Integration CI

on:
  # `rnmobiledenuevo` es la rama de trabajo real y hasta hoy solo se chequeaba en PR: se
  # empujaban decenas de commits de apps/mobile sin que corriera el typecheck de Expo.
  # Los paths son EXACTAMENTE los mismos del pull_request de abajo (el gate es
  # `pnpm --filter @eva/mobile exec tsc --noEmit`, y apps/mobile/tsconfig.json solo mapea
  # `@/*` y `packages/*`).
  push:
    branches: [rnmobiledenuevo]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      # pnpm-workspace.yaml define los `overrides` del monorepo: un cambio ahi puede romper el
      # typecheck de mobile sin tocar apps/mobile.
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile-integration-ci.yml'
  pull_request:
    branches: [rnmobiledenuevo]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      # pnpm-workspace.yaml define los `overrides` del monorepo: un cambio ahi puede romper el
      # typecheck de mobile sin tocar apps/mobile.
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile-integration-ci.yml'
  workflow_dispatch:

# Mismo criterio que ci.yml: un push nuevo cancela el anterior en vuelo, salvo en master.
# El `group` lleva un prefijo PROPIO a proposito: si compartiera `ci-${{ github.ref }}` con
# ci.yml, cada workflow cancelaria al otro sobre el mismo ref.
concurrency:
  group: mobile-integration-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  mobile-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck Expo React Native
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @eva/mobile exec tsc --noEmit 2>&1 | tee mobile-typecheck.log
      - name: Upload mobile typecheck errors
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-typecheck-errors
          path: mobile-typecheck.log
          if-no-files-found: error
          retention-days: 7
