name: Mobile OTA Update

# Publica un OTA de EAS Update desde CI, con las MISMAS secrets que las builds.
#
# POR QUE existe (incidente 2026-08-11): tres OTAs android publicados desde una maquina local
# salieron con el bundle SIN `EXPO_PUBLIC_SUPABASE_URL` (el entorno local no inyectaba las
# variables de forma confiable) y crasheaban al boot con "supabaseUrl is required" — el mismo
# modo de falla que mobile-build.yml ya documenta para builds. Publicar desde CI elimina la
# clase entera de error: el entorno es reproducible y las secrets son las mismas que ya
# producen builds sanas. Los OTA locales quedan prohibidos por runbook.
#
# El guard de abajo falla el job ANTES de publicar si una secret esta vacia: un OTA roto en el
# canal production crashea a TODOS los usuarios del canal hasta el rollback.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      message:
        description: 'Mensaje del update (que lleva y de que commit)'
        required: true
        type: string
      branch:
        description: 'Branch/canal de EAS Update'
        required: true
        default: 'production'
        type: choice
        # production es el unico canal vivo (Play + TestFlight lo comparten). Se deja como
        # choice para sumar canales sin editar el workflow.
        options:
          - production

jobs:
  publish-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # El DSN de Sentry y la URL de la API salen de `eas.json`, que es su fuente UNICA. No son
      # secrets: los dos viajan inlineados en el bundle que se publica, o sea son publicos por
      # construccion. Duplicarlos como secret solo agregaria una copia que se desincroniza.
      - name: Leer config publica de eas.json (fuente unica)
        id: easenv
        run: |
          echo "sentry_dsn=$(jq -r '.build.production.env.EXPO_PUBLIC_SENTRY_DSN // empty' apps/mobile/eas.json)" >> "$GITHUB_OUTPUT"
          echo "api_url=$(jq -r '.build.production.env.EXPO_PUBLIC_API_URL // empty' apps/mobile/eas.json)" >> "$GITHUB_OUTPUT"

      - name: Guard de secrets (fail-fast, mismo criterio que mobile-build.yml)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ steps.easenv.outputs.sentry_dsn }}
        run: |
          missing=""
          [ -z "${SUPABASE_URL// /}" ] && missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -z "${SUPABASE_KEY// /}" ] && missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "ERROR: secret(s) vacio(s):$missing — sin ellas el bundle sale sin Supabase y crashea al boot ('supabaseUrl is required')."
            exit 1
          fi
          # Falla ruidosa a proposito (auditoria 18-08): sin DSN el bundle publicado NO reporta NADA
          # a Sentry. `apps/mobile/app/_layout.tsx` hace `if (SENTRY_DSN) Sentry.init(...)`, asi que
          # la ausencia es SILENCIOSA — la app queda ciega y nadie se entera. Asi estuvimos: todos
          # los eventos moviles de 90 dias venian de la build de tienda (`is_embedded_launch: true`)
          # y ningun OTA reporto jamas. Un OTA sin telemetria es peor que no publicarlo.
          if [ -z "${SENTRY_DSN// /}" ]; then
            echo "ERROR: no pude leer EXPO_PUBLIC_SENTRY_DSN de apps/mobile/eas.json (build.production.env)."
            echo "Sin el, el bundle sale MUDO: cero crashes reportados y cero forma de saber si un fix funciono."
            exit 1
          fi

      - name: Publish OTA update
        working-directory: apps/mobile
        env:
          # `eas update` inlinea process.env.EXPO_PUBLIC_* al bundlear: con exportarlas en el
          # step alcanza (no hace falta tocar eas.json, eso es de perfiles de BUILD).
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Faltaban las dos: `eas update` solo inlinea las EXPO_PUBLIC_* que ve en el entorno del
          # step, y estas viven en `eas.json`, que es de perfiles de BUILD y no lo lee `update`.
          EXPO_PUBLIC_SENTRY_DSN: ${{ steps.easenv.outputs.sentry_dsn }}
          EXPO_PUBLIC_API_URL: ${{ steps.easenv.outputs.api_url }}
        run: |
          # Reintento x3: el primer export en un arbol frio a veces muere con
          # "Cannot find module 'babel-preset-expo'" (race de inicializacion del transform
          # worker de Metro en monorepo pnpm; reproducido local: 1er intento falla, 2do pasa).
          for attempt in 1 2 3; do
            if eas update \
              --branch "${{ inputs.branch }}" \
              --platform "${{ inputs.platform }}" \
              --message "${{ inputs.message }}" \
              --non-interactive; then
              exit 0
            fi
            echo "intento $attempt fallo; reintentando..."
            sleep 5
          done
          exit 1
