name: CI

on:
  push:
    # `rnmobiledenuevo` es la rama de trabajo real (cientos de commits/mes) y hasta hoy
    # empujaba SIN ningun gate: los checks solo corrian en PR y en push a main/master.
    branches: [main, master, rnmobiledenuevo]
    # Auditoria 2026-08-25 de lo que consume cada gate. La conclusion honesta es que en este
    # repo el filtro tiene que ser el arbol completo, porque:
    #   - `pnpm run docs:check` (scripts/check-docs.mjs) recorre `git ls-files` ENTERO
    #     (validateEnvironmentCredentialFallbacks) buscando fallbacks literales de credenciales:
    #     cualquier archivo versionado puede ponerlo rojo, incluidos los otros workflows
    #     de `.github/`.
    #   - el job `unit` (`npx vitest run --shard`) corre `tests/**` (vitest.config.ts) y esos
    #     tests IMPORTAN apps/mobile
    #     por ruta relativa (p.ej. tests/mobile/brand-vars-identity.test.ts ->
    #     ../../apps/mobile/lib/theme, tests/coach-invite-code-url.test.ts lee
    #     apps/mobile/lib/student-links.ts). Excluir apps/mobile pierde cobertura real.
    #   - `pnpm run check:tokens` compara apps/web/src/app/globals.css contra
    #     apps/mobile/global.css y apps/mobile/lib/theme.ts.
    #   - el job `hygiene` corre actionlint sobre TODOS los .github/workflows/*.yml.
    # Por eso queda `**` con una unica exclusion: `.claude/**` (config de agentes, hoy con 0
    # archivos versionados). El ahorro de minutos real viene de `concurrency`, no de este filtro.
    paths:
      - '**'
      - '!.claude/**'
  pull_request:
    branches: [main, master, rnmobiledenuevo]
  workflow_dispatch:

# Una sola corrida viva por ref: un push nuevo cancela el anterior todavia en vuelo (de ahi sale
# el ahorro real de minutos en una rama con decenas de commits por dia). En master NO se cancela:
# cada commit de la rama de release conserva su corrida verificada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # version comes from the root package.json "packageManager" field (pnpm@11.5.0);
      # passing `version:` here too triggers ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      # No dependencies required: catches stale/broken docs and literal credentials early.
      - run: pnpm run docs:check
      # --ignore-scripts blocks postinstall supply chain attacks (pnpm v10+ protection)
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Blocking gate: the 5 react-compiler errors were cleared (Fase 2.4), so lint is green
      # (0 errors; warnings don't fail). Re-introducing a lint error now fails CI.
      - run: pnpm run lint
      - run: pnpm run typecheck
      # EVA DS token parity gate: web globals.css (contract) must match mobile global.css
      - run: pnpm run check:tokens
      # Vitest ya NO corre aca: se movio al job `unit` (3 shards en paralelo). Ver mas abajo.
      - name: pnpm audit (high+)
        run: pnpm audit --audit-level=high --prod
        continue-on-error: true

  # Vitest salio de `quality` y corre en 3 shards paralelos (auditoria de costo 2026-09-02).
  # La suite son ~8.900 tests en 676 archivos y en un runner de 4 vCPU era de lejos el paso mas
  # largo de `quality`; `--shard=i/3` reparte ARCHIVOS, asi que la union de los tres shards es la
  # suite COMPLETA: no se pierde un solo test, solo se paraleliza el tiempo de pared.
  # SIN job de merge a proposito: cada shard falla por su cuenta y con eso el check ya queda rojo.
  # `--reporter=blob` + `vitest run --merge-reports` solo agregaria un cuarto job cuyo unico
  # producto es un resumen unificado; no cambia el veredicto del gate.
  # OJO branch protection: esto publica 3 checks nuevos (`unit (1)`, `unit (2)`, `unit (3)`) y
  # `quality` dejo de cubrir vitest. Si `quality` esta marcado como required, hay que sumar los
  # tres o el gate de tests deja de bloquear.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Sin fail-fast: si un shard se cae, los otros dos igual reportan que rompieron y cuales.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      # version comes from the root package.json "packageManager" field (pnpm@11.5.0);
      # passing `version:` here too triggers ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      # --ignore-scripts blocks postinstall supply chain attacks (pnpm v10+ protection)
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # CI=true lo pone GitHub solo: vitest.config.ts lo lee para usar el runner entero
      # (maxWorkers 100%), mientras que en local se limita al 50 % de los cores.
      - run: npx vitest run --shard=${{ matrix.shard }}/3

  hygiene:
    # Paralelo a `quality` (a proposito SIN `needs`): son gates de higiene del repo/monorepo,
    # no dependen de que compile nada, y no instalan node_modules. Cada paso se corrio
    # LOCALMENTE el 2026-08-25 antes de escribirlo: los que nacian rojos por deuda preexistente
    # quedaron documentados con su ignore o con continue-on-error, nunca como ruido silencioso.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks necesita la historia para resolver `github.event.before..after`; con el
          # fetch-depth: 1 por defecto ese SHA no existe en el clon. El pack son ~58 MB.
          fetch-depth: 0
      # version comes from the root package.json "packageManager" field (pnpm@11.5.0);
      # passing `version:` here too triggers ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      # NO BLOQUEANTE por deuda preexistente: la corrida local del 2026-08-25 sale
      # ERR_PNPM_DEDUPE_CHECK_ISSUES con ~180 paquetes deduplicables. El grueso es la
      # convivencia deliberada de @supabase/supabase-js 2.101.1 (web) y 2.108.2
      # (mobile), mas el doble de Expo SDK 54 (@expo/prebuild-config 54.0.8 y 54.0.9)
      # y la cadena babel/browserslist que arrastra RN.
      # Reporta senal sin poder bloquear; sacar `continue-on-error` cuando corra limpio.
      - name: pnpm dedupe --check (informativo)
        run: pnpm dedupe --check
        continue-on-error: true

      # BLOQUEANTE: con estos flags la corrida local del 2026-08-25 sale 0 errores / 1 warning
      # y exit 0, asi que un desalineo NUEVO del monorepo si rompe el build.
      # Ignores deliberados (deuda existente, no la introduce este job):
      #   -i tailwindcss      -> web v4 vs apps/mobile 3.4.17 (NativeWind); divergencia querida.
      # TODO(deuda) sacar estos cuatro cuando se unifiquen las versiones:
      #   -i @supabase/supabase-js -> raiz ^2.101.1 (web) vs apps/mobile ^2.108.2.
      #   -i @types/react          -> raiz ^19.2.14 vs apps/mobile ~19.1.0 (pin de Expo SDK 54).
      #   -i typescript            -> raiz ^5 vs apps/mobile ~5.9.2.
      #   -r unsync-similar-dependencies -> next ^16.2.12 vs eslint-config-next 16.1.6.
      # Version pinneada a proposito: con `sherif@latest` una release nueva puede sumar una regla
      # y poner el job rojo sin que cambie una sola linea del repo.
      - name: sherif (higiene del monorepo)
        run: >-
          pnpm dlx sherif@1.13.0
          -i tailwindcss
          -i @supabase/supabase-js
          -i @types/react
          -i typescript
          -r unsync-similar-dependencies

      # BLOQUEANTE. Lintea TODOS los workflows del repo. En el runner de GitHub shellcheck viene
      # instalado, asi que actionlint tambien lo aplica a cada bloque `run:` (localmente hay que
      # instalarlo aparte, si no la regla se desactiva sola y el resultado engania).
      # Los dos `-ignore` son DEUDA PREEXISTENTE en workflows ajenos a este cambio, verificada el
      # 2026-08-25 con actionlint 1.7.12 + shellcheck 0.11.0. Sin ellos el job nace rojo:
      #   TODO: .github/workflows/ios-submit-review.yml:64 -> SC2155 (declare and assign separately)
      #   TODO: .github/workflows/mobile-ota.yml:68        -> SC2129 (usar { cmd1; cmd2; } >> file)
      # Sacar los ignores al arreglar esos dos scripts.
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color -ignore 'SC2155' -ignore 'SC2129'

      # BLOQUEANTE: un secreto en el diff tiene que romper el push. Escanea SOLO el rango del
      # evento, NUNCA la historia completa (2574 commits). Corrida local 2026-08-25 sobre
      # HEAD~50..HEAD: "no leaks found".
      # Los datos del evento entran por `env` y no interpolados dentro del script: evita
      # inyeccion de shell y mantiene el bloque legible para shellcheck.
      - name: gitleaks (solo el diff del evento)
        env:
          GITLEAKS_VERSION: '8.30.1'
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          zero='0000000000000000000000000000000000000000'
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "${PUSH_BEFORE}" ] && [ "${PUSH_BEFORE}" != "$zero" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            # Primer push de la rama (before = 000...0), rama recreada, force-push que dejo el SHA
            # huerfano, o workflow_dispatch (sin before/after): se acota a los ultimos 50 commits
            # del head. Sigue sin ser la historia completa.
            range="-n 50 ${PUSH_AFTER:-HEAD}"
          fi
          echo "rango gitleaks: ${range}"
          ./gitleaks git --log-opts="--no-merges ${range}" --redact --no-banner

  e2e:
    needs: quality
    # Manual-only for now: this Playwright-against-real-Supabase suite hangs/times out and
    # had never actually run (CI was dead, so it went unmaintained). Trigger on demand via
    # "Run workflow" while it is tuned (timeouts / seed / login); re-enable on pull_request
    # once it is reliable. quality (typecheck + vitest) is the enforcing PR gate.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # version comes from the root package.json "packageManager" field (pnpm@11.5.0);
      # passing `version:` here too triggers ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: npx playwright install --with-deps
      # SOLO el project `prod-suave` (auditoria 2026-09-02). `npx playwright test` sin `--project`
      # corria los cuatro projects, y el que de verdad se ejecutaba era `chromium`: specs que
      # ESCRIBEN contra la Supabase de produccion (workout-flow finaliza un entrenamiento,
      # checkin-flow sube dos fotos) sobre un coach real, con `retries: 2` — o sea 3 pasadas por
      # spec rojo contra la Micro. Es el espiritu del incidente del 22-08 (6 navegadores contra
      # prod dejaron la base abajo). `prod-suave` trae el freno de mano puesto desde
      # playwright.config.ts: workers 1, fullyParallel off, retries 0, timeout 45 s, header
      # `x-eva-qa: playwright` y el guardian de /api/health de tests/_fixtures/suave.ts. Tambien
      # fija su propia baseURL (PROD_SUAVE_BASE_URL -> https://www.eva-app.cl), asi que aca NO se
      # exporta PLAYWRIGHT_BASE_URL: hacerlo solo agregaria una forma de desviar la tanda.
      # Sin E2E_QA_COACH_* el project `setup` se salta solo y la tanda queda skipped: el fallo
      # correcto, nunca una credencial en el repo (tests/smoke/auth.setup.ts).
      # El paso `test:e2e:enterprise-rls` se elimino: la app Expo enterprise fue ELIMINADA del
      # repo (demolicion B15 / fase E1); no hay retorno en gastar minutos y golpear la DB por
      # una app que ya no existe.
      - run: npx playwright test --project=prod-suave
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_QA_COACH_EMAIL: ${{ secrets.E2E_QA_COACH_EMAIL }}
          E2E_QA_COACH_PASSWORD: ${{ secrets.E2E_QA_COACH_PASSWORD }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-e2e
          path: playwright-report/
          if-no-files-found: ignore

  nutrition-smoke:
    needs: quality
    # En push SOLO corre en master. Al habilitar push en `rnmobiledenuevo` (2026-08-25) este job
    # habria corrido Playwright contra Supabase DE PRODUCCION en cada push de la rama de trabajo
    # (instancia Micro que ya se colgo el 22-08 con QA en paralelo) + ~10-20 min de minutos por
    # push. Los PRs conservan el comportamiento que ya tenian.
    # Fuera de `workflow_dispatch` (decisión del owner 2026-09-02): a mano el job siempre falla
    # porque las variables de Supabase no existen en GH y NO se van a poner las de producción —
    # necesita su propio proyecto Supabase de QA antes de volver a ser lanzable a mano.
    if: ${{ github.event_name != 'workflow_dispatch' && (github.event_name != 'push' || github.ref == 'refs/heads/master') }}
    # Antes era manual-only (`if: workflow_dispatch`) por la misma razón que `e2e`: la suite estaba
    # sin mantención y colgaba contra Supabase real. El motivo real de fondo es que DEPENDE DE
    # SECRETS: sin ellos no hay nada que correr. Ahora corre automático (push a master / PR) con
    # el patrón estándar de CI: cada paso está condicionado a la PRESENCIA de los secrets, así que
    # en un fork o sin credenciales el job no-opea en verde en vez de fallar.
    #
    # `continue-on-error: true` a nivel de job es deliberado y TEMPORAL: el smoke escribe/lee contra
    # Supabase de producción y todavía no tiene una corrida verde observada tras el repunte a V2, así
    # que reporta señal sin poder bloquear un PR por flake de entorno. El gate que SÍ bloquea sigue
    # siendo `quality` (typecheck + lint + vitest). Retirar esta línea cuando el job encadene
    # corridas verdes.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # secrets cannot be used in a job-level `if:` (invalid workflow). Mirror them into
    # env (allowed) and gate each step on env instead, so the job no-ops when the E2E
    # secrets are absent (e.g. forks) without breaking the whole workflow file.
    env:
      # Smoke de la entrada legacy /c/{slug}/nutrition (tolera el redirect a V2).
      E2E_COACH_SLUG: ${{ secrets.E2E_COACH_SLUG }}
      E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
      E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
      # Suite Nutrición V2 (project `nutrition-v2`): corre contra el Preview de Vercel del branch.
      # Sin PLAYWRIGHT_BASE_URL cada spec se auto-omite (ver tests/nutrition-v2/README.md). Se
      # expone con OTRO nombre a nivel de job porque `if:` solo lee `env`, y exportar
      # PLAYWRIGHT_BASE_URL a todo el job desviaría también el smoke legacy al Preview (hoy corre
      # contra el dev server local que levanta playwright.config). El nombre real se pasa
      # únicamente en el step de la suite V2.
      NUTRITION_V2_PREVIEW_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
      E2E_COACH_EMAIL: ${{ secrets.E2E_COACH_EMAIL }}
      E2E_COACH_PASSWORD: ${{ secrets.E2E_COACH_PASSWORD }}
      E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL }}
      E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      # version comes from the root package.json "packageManager" field (pnpm@11.5.0);
      # passing `version:` here too triggers ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Sin secrets del smoke legacy — no-op
        if: ${{ env.E2E_COACH_SLUG == '' || env.E2E_CLIENT_EMAIL == '' || env.E2E_CLIENT_PASSWORD == '' }}
        run: echo "E2E secrets not configured — skipping nutrition smoke."
      # Browsers: los necesita cualquiera de los dos smokes, así que basta con que UNO tenga secrets.
      - name: Instalar navegadores Playwright
        if: ${{ (env.E2E_COACH_SLUG != '' && env.E2E_CLIENT_EMAIL != '' && env.E2E_CLIENT_PASSWORD != '') || (env.NUTRITION_V2_PREVIEW_URL != '' && env.E2E_STUDENT_EMAIL != '') }}
        run: npx playwright install --with-deps
      - if: ${{ env.E2E_COACH_SLUG != '' && env.E2E_CLIENT_EMAIL != '' && env.E2E_CLIENT_PASSWORD != '' }}
        run: pnpm run e2e:check-env
      # Entrada legacy /c/{slug}/nutrition: afirma V1 o V2 según a dónde redirija el canary.
      - name: Smoke entrada nutrición (V1/V2 según canary)
        if: ${{ env.E2E_COACH_SLUG != '' && env.E2E_CLIENT_EMAIL != '' && env.E2E_CLIENT_PASSWORD != '' }}
        run: pnpm run test:e2e:nutrition-v1
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Suite Nutrición V2 real (project `nutrition-v2`). Requiere el Preview de Vercel del branch
      # + las cuentas E2E propias; sin esos secrets los specs se auto-omiten, así que el paso ni se
      # lanza para no gastar minutos en una corrida inerte.
      - name: Suite Nutrición V2 (canary sobre Preview)
        if: ${{ env.NUTRITION_V2_PREVIEW_URL != '' && env.E2E_COACH_EMAIL != '' && env.E2E_COACH_PASSWORD != '' && env.E2E_STUDENT_EMAIL != '' && env.E2E_STUDENT_PASSWORD != '' }}
        run: pnpm run test:e2e:nutrition
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-nutrition-smoke
          path: playwright-report/
          if-no-files-found: ignore
